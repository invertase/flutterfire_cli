name: all_packages
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: bluefireteam/melos-action@v2
        with:
          melos-version: '7.5.1'
      # firebase-ios-sdk 13 (firebase_crashlytics 6) needs Swift tools 6.2.1,
      # so Xcode 26.1 or later.
      - name: Select Xcode version
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install FlutterFire
        run: |
          dart pub global activate --source="path" . --executable="flutterfire" --overwrite
      - name: "Run Tests"
        if: runner.os != 'Windows'
        run: melos run test-offline --no-select
      - name: "Run Tests"
        if: runner.os == 'Windows'
        run: cmd /K melos run test-offline --no-select

  test_firebase:
    name: test_firebase (${{ matrix.os }})
    # Fork PRs don't get secrets, so these only run on code pushed to this
    # repository. To run them for a fork PR, push its head to a branch here
    # and trigger this workflow on that branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    environment: CI Environment
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: bluefireteam/melos-action@v2
        with:
          melos-version: '7.5.1'
      - uses: actions/setup-node@64ed1c7eab4cce3362f8c340dee64e5eaeef8f7c
        if: runner.os == 'Windows'
        name: Install Node.js 18
        with:
          node-version: "18"
      - name: "Install Firebase CLI"
        if: runner.os != 'Windows'
        run: |
          sudo npm i -g firebase-tools
      - name: "Install Firebase CLI"
        if: runner.os == 'Windows'
        run: |
          npm i -g firebase-tools
      # firebase-ios-sdk 13 (firebase_crashlytics 6) needs Swift tools 6.2.1,
      # so Xcode 26.1 or later.
      - name: Select Xcode version
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install FlutterFire
        run: |
          dart pub global activate --source="path" . --executable="flutterfire" --overwrite
      - name: "Run Tests"
        if: runner.os != 'Windows'
        run: melos run test-firebase --no-select
      - name: "Run Tests"
        if: runner.os == 'Windows'
        run: cmd /K melos run test-firebase --no-select
